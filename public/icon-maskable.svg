<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <!-- Full bleed background for adaptive/maskable shapes -->
  <rect width="512" height="512" fill="url(#bg)" />
  
  <!-- Safe Zone Scaled Elements (Center 70% of canvas) -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />
    <!-- TV Screen Outline -->
    <rect x="96" y="112" width="320" height="240" rx="36" fill="url(#accent)" />
    <!-- Screen Glow Play Button -->
    <path d="M224 186 L328 232 L224 278 Z" fill="#ffffff" />
    <!-- TV Base -->
    <path d="M192 384 L320 384" stroke="url(#glow)" stroke-width="16" stroke-linecap="round" />
    <path d="M256 352 L256 384" stroke="url(#glow)" stroke-width="16" stroke-linecap="round" />
    <!-- Signal Dots -->
    <circle cx="360" cy="148" r="8" fill="#22c55e" />
  </g>
</svg>
